<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Державний торговельно-економічний університет — ІС «єКуратор»</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .sute-blue { background-color: #2b569a; }
    .sute-blue-dark { background-color: #1f4277; }
    .sute-nav-hover:hover { background-color: #3b6ab5; }
    .sute-link { color: #1e5bb8; text-decoration: underline; }
    .sute-link:hover { color: #0d3875; }
  </style>
</head>
<body class="bg-[#f0f2f5] text-slate-800 flex h-screen overflow-hidden text-[14px]">

  <!-- Лівий синій сайдбар -->
  <aside class="w-64 sute-blue text-white flex flex-col h-full shrink-0 select-none border-r border-slate-300">
    <!-- Герб / Логотип -->
    <div class="h-20 flex flex-col items-center justify-center border-b border-blue-400/30 p-2 text-center bg-blue-900/20">
      <i class="fa-solid fa-graduation-cap text-2xl text-white mb-1"></i>
      <span class="font-bold text-xs uppercase tracking-wider">ДТЕУ • єКуратор</span>
    </div>

    <!-- Навігація по модулях (без цифр) -->
    <nav class="flex-1 overflow-y-auto py-2 text-[13px]">
      <div class="px-4 pb-1 text-[11px] font-bold text-blue-200/70 uppercase">Основне</div>
      <button onclick="navigate('dashboard')" class="w-full flex items-center justify-between px-4 py-2.5 bg-blue-800 font-bold border-l-4 border-amber-400">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-house w-4"></i> ГОЛОВНА СТОРІНКА</span>
      </button>

      <button onclick="navigate('students')" class="w-full flex items-center justify-between px-4 py-2 text-blue-100 sute-nav-hover">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-users w-4"></i> СПИСОК ГРУПИ</span>
        <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
      </button>

      <div class="px-4 pt-3 pb-1 text-[11px] font-bold text-blue-200/70 uppercase">Модулі системи</div>
      
      <button onclick="navigate('housing')" class="w-full flex items-center justify-between px-4 py-2 text-blue-100 sute-nav-hover">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-hotel w-4"></i> ПОСЕЛЕННЯ</span>
        <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
      </button>

      <button onclick="navigate('attendance')" class="w-full flex items-center justify-between px-4 py-2 text-blue-100 sute-nav-hover">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-calendar-check w-4"></i> ВІДВІДУВАНІСТЬ</span>
        <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
      </button>

      <button onclick="navigate('academic')" class="w-full flex items-center justify-between px-4 py-2 text-blue-100 sute-nav-hover">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-chart-line w-4"></i> УСПІШНІСТЬ І БОРГИ</span>
        <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
      </button>

      <button onclick="navigate('rating')" class="w-full flex items-center justify-between px-4 py-2 text-blue-100 sute-nav-hover">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-award w-4"></i> СТИПЕНДІЯ / РЕЙТИНГ</span>
        <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
      </button>

      <button onclick="navigate('military')" class="w-full flex items-center justify-between px-4 py-2 text-blue-100 sute-nav-hover">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-shield-halved w-4"></i> ВІЙСЬКОВИЙ ОБЛІК</span>
        <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
      </button>

      <button onclick="navigate('social')" class="w-full flex items-center justify-between px-4 py-2 text-blue-100 sute-nav-hover">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-hand-holding-heart w-4"></i> СОЦІАЛЬНИЙ ЗАХИСТ</span>
        <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
      </button>

      <button onclick="navigate('safety')" class="w-full flex items-center justify-between px-4 py-2 text-blue-100 sute-nav-hover">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-compass w-4"></i> АДАПТАЦІЯ ТА БЕЗПЕКА</span>
        <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
      </button>

      <button onclick="navigate('reports')" class="w-full flex items-center justify-between px-4 py-2 text-blue-100 sute-nav-hover">
        <span class="flex items-center gap-2.5"><i class="fa-solid fa-file-lines w-4"></i> ЗВІТНІСТЬ КУРАТОРА</span>
        <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
      </button>
    </nav>

    <!-- Інфо групи внизу сайдбара -->
    <div class="p-4 border-t border-slate-200 bg-slate-50 text-slate-800">
      <div class="text-[11px] font-semibold text-slate-400 uppercase">Активна група</div>
      <div class="text-sm font-bold text-slate-800">ФТМ 1-5 (2026/2027)</div>
    </div>
  </aside>

  <!-- Головний контент-блок -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <!-- Шапка (Header) -->
    <header class="h-16 bg-white border-b border-slate-300 px-6 flex items-center justify-between shrink-0">
      <div class="text-xl font-medium text-slate-800 tracking-tight">
        Державний торговельно-економічний університет
      </div>
      <div class="flex items-center gap-6 text-xs text-slate-600">
        <a href="#" class="sute-link flex items-center gap-1.5"><i class="fa-regular fa-envelope"></i> Зворотній зв'язок</a>
        <span class="text-slate-300">|</span>
        <span class="text-blue-700 font-semibold cursor-pointer">Українська</span>
        <span class="text-slate-300">|</span>
        <div class="flex items-center gap-2 font-medium text-slate-800">
          <span>Ісіков Я. А.</span>
          <i class="fa-solid fa-circle-user text-2xl text-slate-700"></i>
        </div>
      </div>
    </header>

    <!-- Робоча зона -->
    <main id="main-content" class="flex-1 overflow-y-auto p-6">
      
      <!-- Системне повідомлення (Alert) -->
      <div class="bg-[#d4edda] border border-[#c3e6cb] text-[#155724] px-4 py-3 rounded flex items-center justify-between text-sm">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-circle-check text-green-600"></i>
          <span>Привіт, Ісіков Ярослав Андрійович.</span>
        </div>
        <button class="text-green-800 hover:opacity-75 font-bold">×</button>
      </div>

    </main>
  </div>

  <script>
    function navigate(moduleKey) {
      console.log("Відкрито розділ:", moduleKey);
    }
  </script>
</body>
</html>
